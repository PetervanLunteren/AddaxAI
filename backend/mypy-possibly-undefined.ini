# Config for the possibly-undefined gate only. Deliberately NOT the
# project's mypy settings in pyproject.toml.
#
# Those declare `strict = true` and have never been enforced: running
# them today reports 697 errors across 93 files. Cleaning that up is a
# project of its own, and until someone does, a full mypy gate cannot be
# turned on.
#
# One error code is worth gating on its own, though. `possibly-undefined`
# finds names that only exist on some paths through a function, which is
# how a detection-only run started crashing at postprocessing: a variable
# assigned inside `if classification_model_id:` and then read
# unconditionally. That bug reached a user. This catches the whole family
# in seconds, without waiting for the other 697.
#
# Everything else is relaxed so the check reports nothing but its one
# code. The CI step greps for that code, so other errors here are noise
# rather than failures, but keeping the config quiet makes it usable by
# hand too.
[mypy]
ignore_missing_imports = True
follow_imports = silent
enable_error_code = possibly-undefined
