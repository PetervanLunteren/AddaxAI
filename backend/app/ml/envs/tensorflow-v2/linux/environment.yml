# Linux env-tensorflow-v2.
#
# Mirrors the legacy AddaxAI Windows build workflow's env-tensorflow-v2
# package list (build-windows-release.yml:274-291). The TF entry is
# replaced with `tensorflow[and-cuda]==2.16.2`, which is the official
# Linux GPU install for TF 2.16: the extra pulls CUDA 12 + cuDNN via
# pip, no conda cudatoolkit/cudnn pinning needed. Pinned to 2.16.2 to
# match the darwin env's tensorflow-macos==2.16.2 for reproducibility.
name: env-tensorflow-v2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - tensorflow[and-cuda]==2.16.2
      - huggingface_hub==0.23.0
      - jax==0.4.28
      - jaxlib==0.4.28
      - keras==3.3.3
      - keras_cv==0.9.0
      - kimm==0.2.5
      - matplotlib==3.9.0
      - numpy==1.26.4
      - pandas==2.2.2
      - pytest==8.3.0
      - pyyaml==6.0.1
      - scikit-learn==1.4.2
      - tqdm==4.66.4
      - jsonpickle==4.0.1
      # Headless variant: no GUI deps. Used by the classification
      # worker to stream frames straight from source videos so we
      # never write frame JPEGs to disk.
      - opencv-python-headless==4.11.0.86
