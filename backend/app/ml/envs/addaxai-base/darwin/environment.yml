name: env-addaxai-base
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # Core Streamlit packages
    - streamlit
    - streamlit-extras
    - streamlit-aggrid

    # Map and UI components
    - folium
    - streamlit-folium
    - st-checkbox-tree
    - streamlit-antd-components
    - st-flexible-callout-elements
    - streamlit-lottie

    # Image processing and metadata
    - exifread
    - piexif
    - gpsphoto
    - hachoir

    # Utility packages
    - appdirs
    - requests
    - pillow
    - tqdm
    - huggingface_hub
    - anyio<4.0  # Pin to v3.x for Python 3.11 typing compatibility
    - st-modal
    - openpyxl

    # Similarity search
    - faiss-cpu>=1.7.4

    # MegaDetector and detection packages
    - setuptools<82  # yolov5 needs pkg_resources, removed in setuptools 82
    - megadetector==10.0.18
    - ultralytics==8.3.177
