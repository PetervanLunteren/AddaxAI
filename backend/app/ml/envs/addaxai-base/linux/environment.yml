name: env-addaxai-base
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # CUDA torch wheels installed from the pytorch.org cu118 index so
    # GPU acceleration is available out of the box. Pinned to 2.5.1
    # because: (1) torch 2.3.x has a hard `mkl<=2021.4.0` pin on
    # non-darwin that conflicts with megadetector 10.0.18's
    # `mkl==2024.0` and produces ResolutionImpossible; torch >= 2.4
    # dropped the mkl constraint. (2) ultralytics 8.3.177 excludes
    # torch 2.4.0 on win32 (we keep linux on the same version for
    # parity). (3) torch >= 2.6 dropped cu118 wheels entirely. 2.5.1
    # is the highest cu118 build that satisfies all three constraints.
    # Use --extra-index-url (not --index-url) so PyPI still serves
    # the rest of the dependency tree.
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.5.1+cu118
    - torchvision==0.20.1+cu118

    # Image processing and metadata
    - exifread
    - piexif
    - gpsphoto
    - hachoir

    # Utility packages
    - appdirs
    - requests
    - pillow
    - tqdm
    - huggingface_hub
    - anyio<4.0  # Pin to v3.x for Python 3.11 typing compatibility
    - openpyxl

    # Similarity search
    - faiss-cpu>=1.7.4

    # MegaDetector and detection packages
    - setuptools<82  # yolov5 needs pkg_resources, removed in setuptools 82
    # Prebuilt wheel for megadetector's ultralytics-yolov5 dependency.
    # The PyPI release is sdist-only and its setup.py downloads a README
    # from GitHub at build time; that crashes on machines where Python
    # cannot load the Windows certificate store (ssl ASN1 error, beta
    # report 2026-06-10). Installing a wheel skips setup.py entirely.
    - ultralytics-yolov5 @ https://huggingface.co/Addax-Data-Science/pip-wheels/resolve/main/ultralytics_yolov5-0.1.1-py3-none-any.whl#sha256=d532e62d6d7cd6c7381e4453810f31f10fd269cf9f237494bc570e74168dc2e1
    - megadetector==10.0.18
    - ultralytics==8.3.177
