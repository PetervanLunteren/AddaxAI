name: env-addaxai-base
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # CUDA torch wheels installed first so megadetector's transitive
    # torch requirement is satisfied by the GPU build instead of pip
    # falling back to the CPU wheel from PyPI. The +cu118 local-version
    # suffix forces pip to fetch from the cu118 index (PyPI doesn't
    # carry +cu118 wheels), removing the resolver ambiguity that bare
    # `torch==2.3.0` would create against an --extra-index-url fallback.
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.3.0+cu118
    - torchvision==0.18.0+cu118

    # Image processing and metadata
    - exifread
    - piexif
    - gpsphoto
    - hachoir

    # Utility packages
    - appdirs
    - requests
    - pillow
    - tqdm
    - huggingface_hub
    - anyio<4.0  # Pin to v3.x for Python 3.11 typing compatibility
    - openpyxl

    # Similarity search
    - faiss-cpu>=1.7.4

    # MegaDetector and detection packages
    - setuptools<82  # yolov5 needs pkg_resources, removed in setuptools 82
    - megadetector==10.0.18
    - ultralytics==8.3.177

    # Helps Windows pip use the system certificate store (matches the
    # legacy AddaxAI Windows build workflow). Last so it doesn't hold
    # up the rest of the install if its index trips.
    - pip-system-certs
