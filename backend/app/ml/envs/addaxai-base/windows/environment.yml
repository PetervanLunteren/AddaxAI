name: env-addaxai-base
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # CUDA torch wheels installed from the pytorch.org cu118 index so
    # GPU acceleration is available out of the box. Pinned to 2.5.1
    # because: (1) torch 2.3.x has a hard `mkl<=2021.4.0` Windows pin
    # that conflicts with megadetector 10.0.18's `mkl==2024.0` and
    # produces ResolutionImpossible; torch >= 2.4 dropped the mkl
    # constraint. (2) ultralytics 8.3.177 explicitly excludes torch
    # 2.4.0 on win32 (`torch!=2.4.0`). (3) torch >= 2.6 dropped cu118
    # wheels entirely. 2.5.1 is the highest cu118 build that satisfies
    # all three constraints. torchvision 0.20.1 is the matching
    # release. Use --extra-index-url (not --index-url) so PyPI still
    # serves the rest of the dependency tree.
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.5.1+cu118
    - torchvision==0.20.1+cu118

    # Image processing and metadata
    - exifread
    - piexif
    - gpsphoto
    - hachoir

    # Utility packages
    - appdirs
    - requests
    - pillow
    - tqdm
    - huggingface_hub
    - anyio<4.0  # Pin to v3.x for Python 3.11 typing compatibility
    - openpyxl

    # Similarity search
    - faiss-cpu>=1.7.4

    # MegaDetector and detection packages
    - setuptools<82  # yolov5 needs pkg_resources, removed in setuptools 82
    - megadetector==10.0.18
    - ultralytics==8.3.177

    # Helps Windows pip use the system certificate store (matches the
    # legacy AddaxAI Windows build workflow). Last so it doesn't hold
    # up the rest of the install if its index trips.
    - pip-system-certs
