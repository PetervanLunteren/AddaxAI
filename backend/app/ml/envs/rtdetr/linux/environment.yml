name: env-rtdetr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Keep RT-DETR isolated from the existing env-pywildlife and base env.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - torchvision==0.23.0+cu128
      - torchaudio==2.8.0+cu128
      - PytorchWildlife==1.2.4.2
      # PyWildlife 1.2.4 imports its MIT detector modules from package init,
      # but its wheel metadata omits these runtime dependencies.
      - lightning==2.5.3
      - omegaconf==2.3.0
      - supervision==0.23.0
      - numpy==1.24.4
      - pillow==10.4.0
      - humanfriendly==10.0
      - jsonpickle==3.0.2
      - setuptools<82
      - ultralytics-yolov5 @ https://huggingface.co/Addax-Data-Science/pip-wheels/resolve/main/ultralytics_yolov5-0.1.1-py3-none-any.whl#sha256=d532e62d6d7cd6c7381e4453810f31f10fd269cf9f237494bc570e74168dc2e1
      - opencv-python-headless==4.11.0.86
      - wget==3.2
      - scipy==1.14.1
      - pycocotools==2.0.10
      - faster-coco-eval==1.6.6
      - packaging==24.2
      - pyyaml==6.0.2
