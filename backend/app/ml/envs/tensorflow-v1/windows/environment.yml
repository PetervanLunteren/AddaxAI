# Windows env-tensorflow-v1.
#
# Same as linux/tensorflow-v1, which is a verbatim copy of the legacy
# AddaxAI source yml at classification_utils/envs/tensorflow-linux-windows.yml.
# The Windows installer feeds this exact yml to `conda env create` for
# env-tensorflow. pip-system-certs is added at the end to match the
# legacy AddaxAI Windows build workflow's corporate-SSL handling.
name: env-tensorflow-v1
channels:
  - conda-forge
dependencies:
  - python=3.10
  - conda-forge::cudatoolkit=11.2
  - conda-forge::cudnn=8.1.0
  - pip
  - pip:
    - humanfriendly
    - imgaug
    - jsonpickle
    - keras==2.10.0
    - keras_efficientnet_v2
    - matplotlib
    - numpy<2.0.0
    - pandas
    - piexif
    - pillow
    - pyyaml
    - requests
    - scikit-learn
    - tensorflow==2.10.0
    - tensorflow_addons
    - tqdm
    # OpenCV (headless variant: no GUI deps, only the cv2 module).
    # Used by the classification worker to stream frames straight
    # from source videos so we never write frame JPEGs to disk.
    - opencv-python-headless==4.11.0.86
    - pip-system-certs
