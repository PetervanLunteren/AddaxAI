name: env-pytorch
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      - torch==2.0.1
      - torchvision==0.15.2
      - ultralytics==8.0.191
      - numpy==1.24.1
      - humanfriendly==10.0
      - jsonpickle==3.0.2
      - timm
      - dill
      - omegaconf
      # Required for SpeciesNet-fine-tuned classifiers (addax-sppnet
      # type, e.g. HWI-ADS-v1, VIC-ADS-v1, SBUSA-ADS-v1, AHDRIFT-v1).
      # Their backbone is a torch.fx GraphModule that pickled
      # onnx2torch operator classes; loading the .pt fails with
      # ModuleNotFoundError without this package.
      - onnx2torch
      - pytorch-lightning==2.0.6
      - albumentations==1.3.1
      # OpenCV (headless variant: no GUI deps, only the cv2 module).
      # Used by the classification worker to stream frames straight
      # from source videos so we never write frame JPEGs to disk.
      # 4.10.0.84 is the last release that ships py3.8 wheels.
      - opencv-python-headless==4.10.0.84
