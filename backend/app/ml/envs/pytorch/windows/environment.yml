# Windows env-pytorch.
#
# Same package set as darwin/pytorch/environment.yml (the curated
# WebUI baseline). Windows gets cu118 wheels for torch + torchvision
# so pytorch-based classifiers run on GPU. pip-system-certs is added
# at the end to match the legacy AddaxAI Windows build workflow's
# corporate-SSL handling on every env.
name: env-pytorch
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      # The +cu118 local-version suffix forces pip to fetch the GPU
      # wheel from the cu118 index instead of falling back to the CPU
      # wheel on PyPI when both versions match the bare `==2.0.1`.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - ultralytics==8.0.191
      - numpy==1.24.1
      - humanfriendly==10.0
      - jsonpickle==3.0.2
      - timm
      - dill
      - omegaconf
      # Required for SpeciesNet-fine-tuned classifiers (addax-sppnet
      # type, e.g. HWI-ADS-v1, VIC-ADS-v1, SBUSA-ADS-v1, AHDRIFT-v1).
      # Their backbone is a torch.fx GraphModule that pickled
      # onnx2torch operator classes; loading the .pt fails with
      # ModuleNotFoundError without this package.
      - onnx2torch
      - pytorch-lightning==2.0.6
      - albumentations==1.3.1
      - pip-system-certs
