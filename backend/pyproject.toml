[project]
name = "addaxai-backend"
version = "0.1.0"
description = "Camera trap wildlife analysis platform - Backend API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "B008",  # Depends() in FastAPI route argument defaults is idiomatic
    "E712",  # SQLAlchemy filters require == False/True (not `is` or `not`)
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # imports after env var setup is intentional
"app/ml/json_pipeline.py" = ["E402"]  # BoundingBox import at end avoids circular import

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
