name: Build Electron App

# Triggers:
# - release.published: Created a Release in the GitHub UI (with notes) and
#   clicked "Publish". Builds binaries and attaches them to that release.
# - workflow_dispatch: Manual run from the Actions tab. Produces unsigned
#   debug builds (uploaded as workflow artifacts only, kept 14 days).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # Required to attach assets to a release

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.continue-on-error }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is the canonical target. Hard fails on any error.
          - label: macOS arm64
            os: macos
            runs-on: macos-14
            continue-on-error: false
            artifact-name: macos-installers
            artifact-glob: |
              electron/dist-build/*.dmg
              electron/dist-build/*-mac.zip
            electron-builder-args: --mac --arm64
          # Linux is non-blocking until verified end-to-end.
          - label: Linux x64
            os: linux
            runs-on: ubuntu-22.04
            continue-on-error: true
            artifact-name: linux-installers
            artifact-glob: |
              electron/dist-build/*.AppImage
              electron/dist-build/*.deb
            electron-builder-args: --linux
          # Windows is non-blocking until signing is wired up.
          - label: Windows x64
            os: windows
            runs-on: windows-2022
            continue-on-error: true
            artifact-name: windows-installers
            artifact-glob: |
              electron/dist-build/*.exe
              electron/dist-build/*-win.zip
            electron-builder-args: --win

    defaults:
      run:
        # bash is available on all 3 runners (Git Bash on Windows). Keeps
        # the YAML uniform; no PowerShell branches.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Fail BEFORE any expensive build if Apple credentials are missing
      # on a release event. Avoids a 30-minute build that ends in a silent
      # unsigned DMG. (Q3 hard-fail behaviour.)
      - name: Verify Apple credentials
        if: matrix.os == 'macos' && github.event_name == 'release'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for v in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret: $v"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            exit 1
          fi
          echo "All required Apple credentials are set."

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install electron deps
        working-directory: electron
        run: npm ci

      # Source of truth for installer version is the release tag (Q8).
      # On workflow_dispatch we leave package.json's hardcoded version
      # alone so debug builds keep producing predictable filenames.
      - name: Sync version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Empty version derived from tag '$TAG'"
            exit 1
          fi
          echo "Setting electron version to $VERSION (from tag $TAG)"
          cd electron
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Bundle the two default models (MDv5A detection + DINOv2-B
      # embedding) into the DMG so first-run users have working models
      # offline. backend.spec picks these up automatically if the dir
      # exists; absence is harmless. ~600 MB of weights from HuggingFace.
      - name: Download default model weights
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download

          targets = [
              ("det", "MD5A-0-0"),
              ("emb", "DINOV2-VITB14"),
          ]
          out_root = Path("_bundled_models")
          out_root.mkdir(exist_ok=True)
          for category, model_id in targets:
              dst = out_root / category / model_id
              dst.mkdir(parents=True, exist_ok=True)
              repo = f"Addax-Data-Science/{model_id}"
              print(f"Downloading {repo} -> {dst}")
              snapshot_download(
                  repo_id=repo,
                  local_dir=str(dst),
                  local_dir_use_symlinks=False,
              )
          print("Done. Bundled models tree:")
          for p in sorted(out_root.rglob("*")):
              if p.is_file():
                  print(f"  {p.relative_to(out_root)} ({p.stat().st_size:,} bytes)")
          PY

      - name: Build PyInstaller backend
        working-directory: backend
        run: python -m PyInstaller backend.spec --clean

      # Stale signatures on bundled Python dylibs trip the Team-ID check
      # when electron-builder re-signs the .app with our Developer ID.
      # macOS-only by design (the script paths assume macOS dylibs).
      - name: Strip stale signatures from Python libs
        if: matrix.os == 'macos'
        working-directory: backend
        run: python3 remove_python_signature.py

      - name: Verify backend build
        working-directory: backend
        run: ls -lh dist/backend/

      - name: Import macOS signing certificate
        if: matrix.os == 'macos'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning

      - name: Package electron app
        working-directory: electron
        env:
          # macOS: discover the signing identity from the temporary
          # keychain. Off on Linux/Windows (no signing yet).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos' && 'true' || 'false' }}
          # Apple notarytool credentials. notarize.js reads these.
          # Renamed: secret APPLE_ID_PASSWORD -> env APPLE_APP_SPECIFIC_PASSWORD.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # When set to 1, notarize.js raises instead of silently
          # skipping if credentials are missing. We require it on
          # release events to enforce signed/notarized output.
          REQUIRE_NOTARIZATION: ${{ matrix.os == 'macos' && github.event_name == 'release' && '1' || '0' }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.electron-builder-args }}

      # Defence-in-depth verification (Q10). If electron-builder produced
      # an unsigned, non-notarized, or wrong-arch bundle, fail loudly here
      # rather than shipping it to users.
      - name: Verify macOS bundle (arch, signature, stapled ticket)
        if: matrix.os == 'macos'
        run: |
          APP="electron/dist-build/mac-arm64/AddaxAI.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            ls -la electron/dist-build/ || true
            exit 1
          fi

          echo "==> lipo -archs (main binary)"
          lipo -archs "$APP/Contents/MacOS/AddaxAI"

          echo "==> lipo -archs (backend exe)"
          lipo -archs "$APP/Contents/Resources/backend/backend"

          # arm64-only enforcement
          for bin in \
            "$APP/Contents/MacOS/AddaxAI" \
            "$APP/Contents/Resources/backend/backend"; do
            archs=$(lipo -archs "$bin")
            if [ "$archs" != "arm64" ]; then
              echo "::error::$bin has wrong arch: '$archs' (expected 'arm64')"
              exit 1
            fi
          done

          echo "==> codesign --verify --deep --strict"
          codesign --verify --deep --strict --verbose=2 "$APP"

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "==> xcrun stapler validate"
            xcrun stapler validate "$APP"
          else
            echo "==> Skipping stapler validate on workflow_dispatch"
          fi

      - name: Cleanup keychain
        if: always() && matrix.os == 'macos'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: List build outputs
        if: always()
        run: ls -lh electron/dist-build/ || true

      - name: Upload artifacts (workflow run, 14 days)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          retention-days: 14
          if-no-files-found: error

      # Attach binaries to the existing release. The release was already
      # created in the UI (that's what fired this workflow); we never
      # create or modify the release notes here.
      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.artifact-glob }}
          fail_on_unmatched_files: true
